name: Desktop build and release
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows-protocol:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Verify terminal event and cancellation without FFmpeg prerequisites
        run: python -m unittest discover -s tests -p test_protocol.py -v
  native:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            python: "3.14"
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            python: "3.12"
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: "3.14"
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: "3.14"
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate version and native Python architecture
        run: |
          python scripts/ci_release.py version
          python -c 'import scripts.build_sidecar as b; assert b.target() == "${{ matrix.target }}", "Python must run natively on the target architecture"'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf pkg-config gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad libfuse2 libgl1 libglib2.0-0
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: base-devel curl tar make pkgconf mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - uses: actions/cache/restore@v4
        id: video-tools
        with:
          path: |
            build/video-tools
            build/sources/*.tar.*
          key: video-tools-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('scripts/build_ffmpeg.sh', 'scripts/sources.lock.json', 'scripts/verify_sources.py') }}
      - name: Build GPL video tools (Unix)
        if: steps.video-tools.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash scripts/build_ffmpeg.sh
      - name: Build GPL video tools (Windows)
        if: steps.video-tools.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Verify cached source archives
        run: python scripts/verify_sources.py
      - name: Cache verified native tools even if later tests fail
        if: steps.video-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/video-tools
            build/sources/*.tar.*
          key: ${{ steps.video-tools.outputs.cache-primary-key }}
      - run: npm ci
      - name: Install locked Python packages
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Prepare signing (secrets only on version tags; empty on PRs)
        env:
          APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT || '' }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE || '' }}
        run: python scripts/ci_signing.py prepare
      - name: Install Azure Artifact Signing CLI
        if: runner.os == 'Windows' && env.SIGNING_STATUS == 'signed'
        run: |
          cargo install artifact-signing-cli --version 0.11.0 --locked
          powershell -NoProfile -Command '$tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1; if (!$tool) { throw "SignTool missing" }; Add-Content $env:GITHUB_ENV "SIGNTOOL_PATH=$($tool.FullName)"'
      - name: Sign bundled FFmpeg tools before freezing
        if: runner.os == 'Windows' && env.SIGNING_STATUS == 'signed'
        run: |
          python scripts/sign_windows.py build/video-tools/bin/ffmpeg.exe
          python scripts/sign_windows.py build/video-tools/bin/ffprobe.exe
      - name: Build native sidecar and notices
        run: python scripts/build_sidecar.py --tools build/video-tools/bin
      - name: Sign Windows sidecar
        if: runner.os == 'Windows' && env.SIGNING_STATUS == 'signed'
        run: python scripts/sign_windows.py src-tauri/binaries/deface-worker-${{ matrix.target }}.exe
      - name: Frontend verification
        run: npm run build && npm test
      - name: Source backend verification
        run: |
          python -c 'import shutil; shutil.copytree("build/video-tools/bin", "backend/tools", dirs_exist_ok=True)'
          DEFACE_TEST_TOOLS="$PWD/build/video-tools/bin" python -m unittest discover -s tests -v
      - name: Frozen sidecar and release verification
        run: |
          export DEFACE_TEST_SIDECAR="$PWD/src-tauri/binaries/deface-worker-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then export DEFACE_TEST_SIDECAR="$DEFACE_TEST_SIDECAR.exe"; fi
          export DEFACE_TEST_TOOLS="$PWD/build/video-tools/bin"
          python -m unittest discover -s tests -v
      - name: Native verification
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust license inventory
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Generate Rust notices
        run: cd src-tauri && cargo about generate ../scripts/licenses.hbs --config ../about.toml > resources/licenses/RUST_LICENSES.txt
      - name: Remove stale installer output from incremental builds
        run: python -c 'import shutil; shutil.rmtree("src-tauri/target/${{ matrix.target }}/release/bundle", ignore_errors=True)'
      - name: Build native installers (publishing happens only after all jobs pass)
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ github.workspace }}/build/tauri-ci.json -- --locked
      - name: Verify sidecar inside the final macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Deface.app"
          export DEFACE_TEST_SIDECAR="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Deface.app/Contents/MacOS/deface-worker"
          export DEFACE_TEST_TOOLS="$PWD/build/video-tools/bin"
          python -m unittest discover -s tests -p test_worker.py -v
      - name: Verify macOS signatures and notarization; staple DMG
        if: runner.os == 'macOS' && env.SIGNING_STATUS == 'signed'
        run: python scripts/ci_signing.py verify ${{ matrix.target }}
      - name: Verify Windows executable and NSIS installer
        if: runner.os == 'Windows' && env.SIGNING_STATUS == 'signed'
        shell: pwsh
        run: |
          $files = @("src-tauri/target/${{ matrix.target }}/release/mop-deface.exe") + @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | ForEach-Object FullName)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) { throw "Invalid or untimestamped signature: $file" }
          }
      - name: Stage verified installers, corresponding sources and signing manifest
        run: |
          signed_arg=""
          if [ "$SIGNING_STATUS" = "signed" ]; then signed_arg="--signed"; fi
          python scripts/ci_release.py stage --target ${{ matrix.target }} $signed_arg
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: build/release-assets/*
          if-no-files-found: error
      - name: Delete temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f build/signing.keychain-db ]; then security delete-keychain "$PWD/build/signing.keychain-db"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [native, windows-protocol]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: build/release-assets
      - name: Require all platforms and generate checksums/release notes
        run: python scripts/ci_release.py aggregate
      - name: Optional GPG signatures for Linux packages and checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            chmod 700 "$GNUPGHOME"
            trap 'rm -rf "$GNUPGHOME"' EXIT
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            for asset in build/release-assets/*.AppImage build/release-assets/*.deb build/release-assets/SHA256SUMS; do
              printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$asset"
              gpg --verify "$asset.asc" "$asset"
            done
            gpg --armor --export > build/release-assets/GPG-PUBLIC-KEY.asc
            printf '\nLinux packages and SHA256SUMS include verified detached GPG signatures.\n' >> build/release-notes.md
          elif [ -n "$GPG_PASSPHRASE" ]; then
            echo 'GPG_PASSPHRASE requires GPG_PRIVATE_KEY' >&2
            exit 1
          fi
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite a previous release or publish partial matrix results.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; remove its draft explicitly before retrying.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/release-assets/* --verify-tag --draft --title "Deface $RELEASE_TAG" --notes-file build/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
